
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Plot Coordinates – Mr. McLean Math</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root{
      --bg:#0b1020;
      --panel:#1a2338;
      --panel-alt:#121826;
      --accent:#4fc3f7;
      --accent-soft:#28374f;
      --text:#e6ecff;
      --muted:#b7c2ff;
      --border:#2b3550;
      --error:#ff6b6b;
      --success:#81c784;
      --shadow:0 16px 34px rgba(0,0,0,0.4);
      --glow:0 0 18px rgba(79,195,247,0.2);
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      min-height:100vh;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:radial-gradient(circle at top,#1b2945 0,#060812 55%,#01020a 100%);
      color:var(--text);
    }

    .app{
      max-width:1060px;
      margin:0 auto;
      padding:18px 16px 24px;
    }

    .fun-font{
      font-family:"Comic Sans MS","Trebuchet MS","Arial Rounded MT Bold","Segoe UI",system-ui,sans-serif;
    }

    header{
      text-align:center;
      margin-bottom:14px;
    }

    h1{
      margin:0;
      font-size:clamp(2rem,5vw,2.65rem);
      line-height:1.05;
      letter-spacing:0.01em;
      text-shadow:var(--glow);
    }

    .mode-selector{
      display:flex;
      justify-content:center;
      flex-wrap:wrap;
      gap:10px;
      margin-bottom:16px;
    }

    .chip,
    button{
      font-family:"Comic Sans MS","Trebuchet MS","Arial Rounded MT Bold","Segoe UI",system-ui,sans-serif;
      font-weight:800;
      border-radius:999px;
      border:1px solid var(--border);
      cursor:pointer;
      transition:transform 0.08s ease,filter 0.15s ease;
    }

    .chip{
      padding:10px 16px;
      background:rgba(0,0,0,0.22);
      color:var(--muted);
      font-size:0.98rem;
      box-shadow:0 8px 20px rgba(0,0,0,0.25);
    }

    .chip:hover,
    button:hover:not(:disabled){ filter:brightness(1.07); }

    .chip:active,
    button:active:not(:disabled){ transform:translateY(1px); }

    .chip.active{
      border-color:var(--accent);
      background:linear-gradient(135deg,var(--accent-soft),rgba(79,195,247,0.16));
      color:var(--text);
      box-shadow:0 8px 20px rgba(0,0,0,0.25),var(--glow);
    }

    .layout{
      display:grid;
      grid-template-columns:minmax(0,2fr) minmax(250px,0.9fr);
      gap:16px;
      align-items:start;
    }

    .panel{
      background:linear-gradient(145deg,var(--panel),var(--panel-alt));
      border:1px solid var(--border);
      border-radius:18px;
      padding:16px;
      box-shadow:var(--shadow);
    }

    .panel-title{
      margin:0 0 10px;
      font-size:1.2rem;
      font-weight:900;
      text-shadow:var(--glow);
    }

    .instructions{
      margin:0 0 10px;
      color:var(--muted);
      font-size:1rem;
      line-height:1.35;
    }

    .problem-box{
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:58px;
      margin-bottom:12px;
      padding:12px 14px;
      text-align:center;
      background:rgba(0,0,0,0.24);
      border:1px solid rgba(255,255,255,0.06);
      border-radius:14px;
    }

    .problem-main{
      font-family:"Comic Sans MS","Trebuchet MS","Arial Rounded MT Bold","Segoe UI",system-ui,sans-serif;
      font-size:clamp(1.35rem,4vw,1.7rem);
      font-weight:900;
      letter-spacing:0.02em;
      text-shadow:var(--glow);
    }

    .graph-container{
      display:flex;
      justify-content:center;
      align-items:center;
      padding:10px;
      background:#fff;
      border:1px solid var(--border);
      border-radius:14px;
      box-shadow:0 8px 20px rgba(0,0,0,0.3);
      overflow:hidden;
    }

    canvas{
      display:block;
      width:100%;
      max-width:420px;
      height:auto;
      background:#fff;
      border:2px solid #000;
      border-radius:10px;
      image-rendering:crisp-edges;
      touch-action:manipulation;
      cursor:crosshair;
    }

    .inputs{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:10px;
      margin-top:12px;
    }

    .field{
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    .field label{
      color:var(--muted);
      font-size:0.92rem;
      font-weight:800;
    }

    .field input{
      width:100%;
      padding:10px 12px;
      border:1px solid var(--border);
      border-radius:12px;
      background:rgba(0,0,0,0.35);
      color:var(--text);
      font-size:1.05rem;
      font-weight:800;
      font-family:"Comic Sans MS","Trebuchet MS","Arial Rounded MT Bold","Segoe UI",system-ui,sans-serif;
    }

    .field input:focus{
      outline:2px solid var(--accent);
      border-color:var(--accent);
    }

    .controls{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top:12px;
    }

    button{
      padding:10px 16px;
      font-size:0.98rem;
      color:var(--text);
      background:rgba(0,0,0,0.16);
    }

    button.primary{
      border-color:transparent;
      background:linear-gradient(135deg,var(--accent),rgba(79,195,247,0.65));
      color:#020308;
      box-shadow:0 8px 20px rgba(0,0,0,0.3),var(--glow);
    }

    button.secondary{
      color:var(--muted);
    }

    button:disabled{
      opacity:0.45;
      cursor:default;
    }

    .feedback-panel{
      min-height:92px;
      padding:12px;
      background:rgba(0,0,0,0.28);
      border:1px solid var(--border);
      border-radius:14px;
    }

    .feedback-main{
      min-height:1.45em;
      margin-bottom:5px;
      font-size:1.15rem;
      font-weight:900;
      text-shadow:var(--glow);
    }

    .feedback-main.ok{ color:var(--success); }
    .feedback-main.bad{ color:var(--error); }

    .feedback-detail{
      color:var(--muted);
      font-size:0.95rem;
      line-height:1.35;
      white-space:pre-line;
    }

    .results{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:10px;
      margin-top:12px;
    }

    .result-card{
      padding:10px 12px;
      text-align:center;
      background:rgba(0,0,0,0.24);
      border:1px solid var(--border);
      border-radius:12px;
    }

    .result-label{
      display:block;
      margin-bottom:2px;
      color:var(--muted);
      font-size:0.84rem;
      font-weight:700;
    }

    .result-value{
      font-size:1.35rem;
      font-weight:900;
    }

    footer{
      margin-top:16px;
      padding-top:10px;
      border-top:1px solid var(--border);
      color:var(--muted);
      font-size:0.88rem;
      text-align:center;
    }

    .sr-only{
      position:absolute;
      width:1px;
      height:1px;
      padding:0;
      margin:-1px;
      overflow:hidden;
      clip:rect(0,0,0,0);
      white-space:nowrap;
      border:0;
    }

    @media (max-width:800px){
      .layout{ grid-template-columns:1fr; }
    }

    @media (max-width:520px){
      .app{ padding:14px 10px 20px; }
      .panel{ padding:12px; border-radius:16px; }
      .mode-selector{ gap:8px; }
      .chip{ flex:1 1 140px; padding:10px 12px; }
      .graph-container{ padding:7px; }
      .controls button{ flex:1 1 130px; justify-content:center; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="fun-font">
      <h1>Plot Coordinates</h1>
    </header>

    <div class="mode-selector fun-font" aria-label="Practice type">
      <button class="chip active" data-gametype="plot" type="button">Plot a Point</button>
      <button class="chip" data-gametype="read" type="button">Read a Point</button>
    </div>

    <main class="layout">
      <section class="panel fun-font" aria-labelledby="practiceTitle">
        <h2 class="panel-title" id="practiceTitle">Plot the Point</h2>
        <p class="instructions" id="instructions" aria-live="polite"></p>

        <div class="problem-box">
          <div class="problem-main" id="problemText">(x, y) = (2, -3)</div>
        </div>

        <div class="graph-container">
          <canvas id="graphCanvas" width="420" height="420" aria-label="Coordinate grid"></canvas>
        </div>

        <div class="inputs" id="readInputs" style="display:none;">
          <div class="field">
            <label for="inputX">x-coordinate</label>
            <input id="inputX" type="text" autocomplete="off" inputmode="text" spellcheck="false" />
          </div>
          <div class="field">
            <label for="inputY">y-coordinate</label>
            <input id="inputY" type="text" autocomplete="off" inputmode="text" spellcheck="false" />
          </div>
        </div>

        <div class="controls">
          <button id="submitBtn" class="primary" type="button">Check Answer</button>
          <button id="nextBtn" class="secondary" type="button">New Point</button>
          <button id="clearBtn" class="secondary" type="button">Clear</button>
        </div>
      </section>

      <aside class="panel fun-font" aria-label="Feedback and results">
        <h2 class="panel-title">Results</h2>

        <div class="feedback-panel">
          <div id="feedbackMain" class="feedback-main" aria-live="polite"></div>
          <div id="feedbackDetail" class="feedback-detail"></div>
        </div>

        <div class="results" aria-label="Answer totals">
          <div class="result-card">
            <span class="result-label">Correct</span>
            <span class="result-value" id="correctValue">0</span>
          </div>
          <div class="result-card">
            <span class="result-label">Incorrect</span>
            <span class="result-value" id="incorrectValue">0</span>
          </div>
        </div>
      </aside>
    </main>

    <footer class="fun-font">Created by Mr. McLean Math.</footer>
    <div class="sr-only" aria-live="polite" id="ariaStatus"></div>
  </div>

  <script>
  (function(){
    const state = {
      gameType:"plot",
      currentPoint:null,
      selectedPoint:null,
      awaitingNext:false,
      correct:0,
      incorrect:0
    };

    const gameTypeChips = document.querySelectorAll(".chip[data-gametype]");
    const practiceTitle = document.getElementById("practiceTitle");
    const instructionsEl = document.getElementById("instructions");
    const problemText = document.getElementById("problemText");
    const graphCanvas = document.getElementById("graphCanvas");
    const readInputs = document.getElementById("readInputs");
    const inputX = document.getElementById("inputX");
    const inputY = document.getElementById("inputY");
    const submitBtn = document.getElementById("submitBtn");
    const nextBtn = document.getElementById("nextBtn");
    const clearBtn = document.getElementById("clearBtn");
    const feedbackMain = document.getElementById("feedbackMain");
    const feedbackDetail = document.getElementById("feedbackDetail");
    const correctValue = document.getElementById("correctValue");
    const incorrectValue = document.getElementById("incorrectValue");
    const ariaStatus = document.getElementById("ariaStatus");

    const grid = {
      xmin:-6,
      xmax:6,
      ymin:-6,
      ymax:6,
      padding:30
    };

    function getCtx(){
      return graphCanvas.getContext("2d");
    }

    function mathToPixel(x,y){
      const w = graphCanvas.width;
      const h = graphCanvas.height;
      const p = grid.padding;
      const sx = (w - 2 * p) / (grid.xmax - grid.xmin);
      const sy = (h - 2 * p) / (grid.ymax - grid.ymin);

      return {
        x:p + (x - grid.xmin) * sx,
        y:h - (p + (y - grid.ymin) * sy)
      };
    }

    function pixelToMath(px,py){
      const w = graphCanvas.width;
      const h = graphCanvas.height;
      const p = grid.padding;
      const sx = (w - 2 * p) / (grid.xmax - grid.xmin);
      const sy = (h - 2 * p) / (grid.ymax - grid.ymin);

      return {
        x:grid.xmin + (px - p) / sx,
        y:grid.ymin + (h - py - p) / sy
      };
    }

    function snapToIntegerPoint(px,py){
      const m = pixelToMath(px,py);
      const xi = Math.round(m.x);
      const yi = Math.round(m.y);

      if (xi < grid.xmin || xi > grid.xmax || yi < grid.ymin || yi > grid.ymax){
        return null;
      }

      const p = mathToPixel(xi,yi);
      const dist = Math.hypot(p.x - px,p.y - py);
      if (dist > 14) return null;

      return {x:xi,y:yi};
    }

    function drawGrid(){
      const ctx = getCtx();
      const w = graphCanvas.width;
      const h = graphCanvas.height;
      const p = grid.padding;
      const sx = (w - 2 * p) / (grid.xmax - grid.xmin);
      const sy = (h - 2 * p) / (grid.ymax - grid.ymin);

      ctx.clearRect(0,0,w,h);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0,0,w,h);

      ctx.lineWidth = 1.4;
      ctx.strokeStyle = "#777777";

      for (let x = grid.xmin; x <= grid.xmax; x++){
        const px = p + (x - grid.xmin) * sx;
        ctx.beginPath();
        ctx.moveTo(px,p);
        ctx.lineTo(px,h - p);
        ctx.stroke();
      }

      for (let y = grid.ymin; y <= grid.ymax; y++){
        const py = h - (p + (y - grid.ymin) * sy);
        ctx.beginPath();
        ctx.moveTo(p,py);
        ctx.lineTo(w - p,py);
        ctx.stroke();
      }

      ctx.strokeStyle = "#000000";
      ctx.lineWidth = 3;

      const x0 = p + (0 - grid.xmin) * sx;
      const y0 = h - (p + (0 - grid.ymin) * sy);

      ctx.beginPath();
      ctx.moveTo(x0,p);
      ctx.lineTo(x0,h - p);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(p,y0);
      ctx.lineTo(w - p,y0);
      ctx.stroke();

      ctx.fillStyle = "#000000";
      ctx.font = "10px system-ui";

      for (let x = grid.xmin; x <= grid.xmax; x++){
        const px = p + (x - grid.xmin) * sx;
        ctx.beginPath();
        ctx.moveTo(px,y0 - 3);
        ctx.lineTo(px,y0 + 3);
        ctx.stroke();
        if (x !== 0) ctx.fillText(String(x),px - 3,y0 + 12);
      }

      for (let y = grid.ymin; y <= grid.ymax; y++){
        const py = h - (p + (y - grid.ymin) * sy);
        ctx.beginPath();
        ctx.moveTo(x0 - 3,py);
        ctx.lineTo(x0 + 3,py);
        ctx.stroke();
        if (y !== 0) ctx.fillText(String(y),x0 + 6,py + 3);
      }
    }

    function drawPoint(pt,color,radius){
      const ctx = getCtx();
      const p = mathToPixel(pt.x,pt.y);

      ctx.save();
      ctx.fillStyle = color || "#ff0000";
      ctx.beginPath();
      ctx.arc(p.x,p.y,radius || 6,0,Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawCrosshair(pt){
      const ctx = getCtx();
      const p = mathToPixel(pt.x,pt.y);

      ctx.save();
      ctx.strokeStyle = "#ff0000";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(p.x - 10,p.y);
      ctx.lineTo(p.x + 10,p.y);
      ctx.moveTo(p.x,p.y - 10);
      ctx.lineTo(p.x,p.y + 10);
      ctx.stroke();
      ctx.restore();
    }

    function renderCanvas(){
      drawGrid();

      if (state.currentPoint && state.gameType === "read"){
        drawCrosshair(state.currentPoint);
        drawPoint(state.currentPoint,"#ff0000",6);
      }

      if (state.selectedPoint && state.gameType === "plot"){
        drawPoint(state.selectedPoint,"#ff0000",6);
      }
    }

    function randInt(min,max){
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function generatePoint(){
      let x;
      let y;
      let tries = 0;

      do{
        x = randInt(-5,5);
        y = randInt(-5,5);
        tries++;
        if (tries > 50) break;
      } while (x === 0 && y === 0 && Math.random() < 0.8);

      return {x,y};
    }

    function parseIntStrict(value){
      if (value === null || value === undefined) return null;
      const text = String(value).replace(/\s+/g,"");
      if (!/^-?\d+$/.test(text)) return null;
      const number = parseInt(text,10);
      return Number.isNaN(number) ? null : number;
    }

    function setInstructions(text){
      instructionsEl.textContent = text;
      ariaStatus.textContent = text;
    }

    function setFeedback(mainText,isCorrect,detail){
      feedbackMain.textContent = mainText || "";
      feedbackMain.classList.remove("ok","bad");
      if (isCorrect === true) feedbackMain.classList.add("ok");
      if (isCorrect === false) feedbackMain.classList.add("bad");
      feedbackDetail.textContent = detail || "";
    }

    function setFeedbackDetail(text){
      feedbackDetail.textContent = text || "";
    }

    function updateResults(){
      correctValue.textContent = state.correct;
      incorrectValue.textContent = state.incorrect;
    }

    function updateControls(){
      submitBtn.disabled = state.awaitingNext;
      clearBtn.disabled = state.awaitingNext;
    }

    function renderProblemUI(){
      state.selectedPoint = null;
      inputX.value = "";
      inputY.value = "";

      if (state.gameType === "plot"){
        practiceTitle.textContent = "Plot the Point";
        readInputs.style.display = "none";
        problemText.textContent = "(x, y) = (" + state.currentPoint.x + ", " + state.currentPoint.y + ")";
        setInstructions("Click the matching grid point, then check your answer.");
      } else {
        practiceTitle.textContent = "Read the Point";
        readInputs.style.display = "grid";
        problemText.textContent = "What are the coordinates of the point?";
        setInstructions("Enter the x-coordinate and y-coordinate, then check your answer.");
        inputX.focus();
      }

      setFeedback("",null,"");
      updateControls();
      renderCanvas();
    }

    function loadNewProblem(){
      state.currentPoint = generatePoint();
      state.awaitingNext = false;
      renderProblemUI();
    }

    function handleCanvasClick(evt){
      if (state.gameType !== "plot") return;

      if (state.awaitingNext){
        setFeedbackDetail("Choose New Point to continue.");
        return;
      }

      const rect = graphCanvas.getBoundingClientRect();
      const scaleX = graphCanvas.width / rect.width;
      const scaleY = graphCanvas.height / rect.height;
      const px = (evt.clientX - rect.left) * scaleX;
      const py = (evt.clientY - rect.top) * scaleY;
      const snapped = snapToIntegerPoint(px,py);

      if (!snapped){
        setFeedback("Select a grid intersection.",null,"Click closer to the intersection you want to choose.");
        return;
      }

      state.selectedPoint = snapped;
      setFeedback("",null,"Selected: (" + snapped.x + ", " + snapped.y + ")");
      renderCanvas();
    }

    function handleSubmit(){
      if (!state.currentPoint || state.awaitingNext) return;

      let isCorrect = false;
      let detail = "";

      if (state.gameType === "plot"){
        if (!state.selectedPoint){
          setFeedback("Select a point first.",null,"Click a grid intersection, then check your answer.");
          return;
        }

        isCorrect = state.selectedPoint.x === state.currentPoint.x &&
                    state.selectedPoint.y === state.currentPoint.y;

        if (!isCorrect){
          detail = "Correct point: (" + state.currentPoint.x + ", " + state.currentPoint.y + ").";
        }
      } else {
        if (inputX.value.trim() === "" || inputY.value.trim() === ""){
          setFeedback("Enter both coordinates.",null,"Type an x-coordinate and a y-coordinate first.");
          return;
        }

        const xVal = parseIntStrict(inputX.value);
        const yVal = parseIntStrict(inputY.value);

        if (xVal === null || yVal === null){
          setFeedback("Use integers only.",null,"Examples: -3, 0, 4");
          return;
        }

        isCorrect = xVal === state.currentPoint.x && yVal === state.currentPoint.y;

        if (!isCorrect){
          detail = "Correct answer: (" + state.currentPoint.x + ", " + state.currentPoint.y + ").";
        }
      }

      if (isCorrect){
        state.correct++;
        setFeedback("Correct!",true,"Press Enter or choose New Point to continue.");
      } else {
        state.incorrect++;
        setFeedback("Not quite.",false,detail + " Press Enter or choose New Point to continue.");
      }

      state.awaitingNext = true;
      updateResults();
      updateControls();
    }

    function handleNext(){
      loadNewProblem();
    }

    function handleClear(){
      if (state.awaitingNext) return;

      if (state.gameType === "plot"){
        state.selectedPoint = null;
        setFeedback("",null,"");
        renderCanvas();
      } else {
        inputX.value = "";
        inputY.value = "";
        setFeedback("",null,"");
        inputX.focus();
      }
    }

    gameTypeChips.forEach(chip => {
      chip.addEventListener("click",() => {
        gameTypeChips.forEach(item => item.classList.remove("active"));
        chip.classList.add("active");
        state.gameType = chip.getAttribute("data-gametype");
        loadNewProblem();
      });
    });

    graphCanvas.addEventListener("click",handleCanvasClick);
    submitBtn.addEventListener("click",handleSubmit);
    nextBtn.addEventListener("click",handleNext);
    clearBtn.addEventListener("click",handleClear);

    document.addEventListener("keydown",evt => {
      if (evt.key === "Enter"){
        if (state.awaitingNext) handleNext();
        else handleSubmit();
        evt.preventDefault();
      } else if (evt.key === "Escape"){
        handleClear();
        evt.preventDefault();
      } else if (evt.key.toLowerCase() === "n" && document.activeElement !== inputX && document.activeElement !== inputY){
        handleNext();
      }
    });

    function init(){
      updateResults();
      loadNewProblem();
    }

    init();
  })();
  </script>
</body>
</html>
